<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Mac 初始设置流程</title>
  <desc id="desc">在 Mac 上安装应用，确认 Git，创建 SSH key，添加到 GitHub。</desc>
  <rect width="1000" height="300" fill="#f8fafc"/>
  <text x="500" y="48" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#172033">Mac 流程</text>
  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <circle cx="120" cy="150" r="48" fill="#e8f3ff" stroke="#70a8e8" stroke-width="2"/>
    <text x="120" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">应用</text>
    <text x="120" y="169" text-anchor="middle" font-size="13" fill="#506071">登录</text>
    <path d="M174 150h72" stroke="#8290a3" stroke-width="3"/><path d="M246 150l-12-8v16z" fill="#8290a3"/>
    <circle cx="310" cy="150" r="48" fill="#fff3d6" stroke="#d7a51d" stroke-width="2"/>
    <text x="310" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">Git</text>
    <text x="310" y="169" text-anchor="middle" font-size="13" fill="#506071">Git 和 gh</text>
    <path d="M364 150h72" stroke="#8290a3" stroke-width="3"/><path d="M436 150l-12-8v16z" fill="#8290a3"/>
    <circle cx="500" cy="150" r="48" fill="#eaf7ea" stroke="#6dbb74" stroke-width="2"/>
    <text x="500" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">SSH key</text>
    <text x="500" y="169" text-anchor="middle" font-size="13" fill="#506071">自动添加</text>
    <path d="M554 150h72" stroke="#8290a3" stroke-width="3"/><path d="M626 150l-12-8v16z" fill="#8290a3"/>
    <circle cx="690" cy="150" r="48" fill="#f5eafd" stroke="#b783d8" stroke-width="2"/>
    <text x="690" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">GitHub</text>
    <text x="690" y="169" text-anchor="middle" font-size="13" fill="#506071">浏览器授权</text>
    <path d="M744 150h72" stroke="#8290a3" stroke-width="3"/><path d="M816 150l-12-8v16z" fill="#8290a3"/>
    <circle cx="880" cy="150" r="48" fill="#eef1f5" stroke="#8d99aa" stroke-width="2"/>
    <text x="880" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#172033">确认</text>
    <text x="880" y="169" text-anchor="middle" font-size="13" fill="#506071">连接成功</text>
  </g>
  <text x="500" y="245" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#506071">不需要复制粘贴 public key。private key 不要给任何人。</text>
</svg>

